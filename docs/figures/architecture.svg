<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.4;rx:6}
      .soft{fill:#f4f6fa;stroke:#8a94a6;stroke-width:1.2;rx:6}
      .mom{fill:#fff;stroke:#333;stroke-width:1.4;stroke-dasharray:5 3;rx:6}
      .t{fill:#222} .s{fill:#666;font-size:11px} .h{font-weight:700}
      .arr{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .loss{fill:#fff7e6;stroke:#b8860b;stroke-width:1.4;rx:6}
    </style>
  </defs>

  <!-- input -->
  <rect x="16" y="150" width="112" height="120" class="soft"/>
  <text x="72" y="172" text-anchor="middle" class="t h">image</text>
  <text x="72" y="190" text-anchor="middle" class="s">+ superpixel mask</text>
  <rect x="34" y="200" width="76" height="56" fill="#dfe7f3" stroke="#8a94a6"/>
  <path d="M34,228 q20,-14 38,0 t38,0 M60,200 v56 M86,200 v56" stroke="#8a94a6" fill="none"/>
  <text x="72" y="284" text-anchor="middle" class="s">(SLIC, n=100)</text>

  <!-- two views -->
  <path d="M128,190 C160,190 160,110 190,110" class="arr"/>
  <path d="M128,230 C160,230 160,310 190,310" class="arr"/>
  <rect x="190" y="72" width="130" height="76" class="soft"/>
  <text x="255" y="96" text-anchor="middle" class="t h">view q</text>
  <text x="255" y="114" text-anchor="middle" class="s">crop · flip · colour</text>
  <text x="255" y="132" text-anchor="middle" class="s">mask cropped/flipped identically</text>
  <rect x="190" y="272" width="130" height="76" class="soft"/>
  <text x="255" y="296" text-anchor="middle" class="t h">view k</text>
  <text x="255" y="314" text-anchor="middle" class="s">independent augmentation</text>
  <text x="255" y="332" text-anchor="middle" class="s">same shared parameters</text>

  <!-- encoders -->
  <path d="M320,110 H360" class="arr"/><path d="M320,310 H360" class="arr"/>
  <rect x="360" y="80" width="120" height="60" class="box"/>
  <text x="420" y="104" text-anchor="middle" class="t h">encoder</text>
  <text x="420" y="122" text-anchor="middle" class="s">any backbone · C×H×W</text>
  <rect x="360" y="280" width="120" height="60" class="mom"/>
  <text x="420" y="304" text-anchor="middle" class="t h">momentum encoder</text>
  <text x="420" y="322" text-anchor="middle" class="s">EMA, no gradient</text>
  <path d="M420,140 V280" stroke="#999" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  <text x="432" y="214" class="s">EMA</text>

  <!-- global path -->
  <path d="M480,96 H540" class="arr"/><path d="M480,296 H540" class="arr"/>
  <rect x="540" y="30" width="118" height="46" class="box"/>
  <text x="599" y="50" text-anchor="middle" class="t h">global pool</text>
  <text x="599" y="66" text-anchor="middle" class="s">+ MLP head</text>
  <rect x="540" y="346" width="118" height="46" class="mom"/>
  <text x="599" y="366" text-anchor="middle" class="t h">global pool</text>
  <text x="599" y="382" text-anchor="middle" class="s">+ MLP head (EMA)</text>
  <path d="M540,96 C520,96 520,53 540,53" class="arr"/>
  <path d="M540,296 C520,296 520,369 540,369" class="arr"/>

  <!-- region path -->
  <rect x="540" y="130" width="118" height="70" class="box"/>
  <text x="599" y="152" text-anchor="middle" class="t h">region pool</text>
  <text x="599" y="168" text-anchor="middle" class="s">mean over each superpixel,</text>
  <text x="599" y="184" text-anchor="middle" class="s">occupancy-weighted · R×C</text>
  <rect x="540" y="230" width="118" height="70" class="mom"/>
  <text x="599" y="252" text-anchor="middle" class="t h">region pool</text>
  <text x="599" y="268" text-anchor="middle" class="s">same sampled region ids</text>
  <text x="599" y="284" text-anchor="middle" class="s">(visible in both views)</text>
  <path d="M480,124 C510,124 510,165 540,165" class="arr"/>
  <path d="M480,282 C510,282 510,265 540,265" class="arr"/>

  <!-- heads -->
  <path d="M658,165 H700" class="arr"/><path d="M658,265 H700" class="arr"/>
  <rect x="700" y="142" width="96" height="46" class="box"/>
  <text x="748" y="162" text-anchor="middle" class="t h">region head</text>
  <text x="748" y="178" text-anchor="middle" class="s">MLP, per region</text>
  <rect x="700" y="242" width="96" height="46" class="mom"/>
  <text x="748" y="262" text-anchor="middle" class="t h">region head</text>
  <text x="748" y="278" text-anchor="middle" class="s">(EMA)</text>

  <!-- losses -->
  <path d="M658,53 H830" class="arr"/><path d="M658,369 C760,369 760,90 830,90" class="arr"/>
  <rect x="830" y="34" width="134" height="72" class="loss"/>
  <text x="897" y="56" text-anchor="middle" class="t h">L_global</text>
  <text x="897" y="74" text-anchor="middle" class="s">NT-Xent vs memory</text>
  <text x="897" y="90" text-anchor="middle" class="s">bank of 4096 keys</text>

  <path d="M796,165 H830" class="arr"/><path d="M796,265 C812,265 812,180 830,180" class="arr"/>
  <rect x="830" y="150" width="134" height="86" class="loss"/>
  <text x="897" y="172" text-anchor="middle" class="t h">L_region</text>
  <text x="897" y="190" text-anchor="middle" class="s">positive = same image and</text>
  <text x="897" y="206" text-anchor="middle" class="s">same superpixel id;</text>
  <text x="897" y="222" text-anchor="middle" class="s">all other regions negative</text>

  <rect x="700" y="330" width="264" height="56" class="loss"/>
  <text x="832" y="352" text-anchor="middle" class="t h">L = (1 − λ)·L_global + λ·L_region</text>
  <text x="832" y="372" text-anchor="middle" class="s">λ = 0 recovers MoCo v2 exactly</text>
  <path d="M897,106 V150" class="arr" opacity="0"/>
  <path d="M897,236 V330" class="arr"/>
  <path d="M870,106 C870,130 760,130 760,330" class="arr"/>

  <!-- footnote -->
  <text x="16" y="405" class="s">Masks are used only to pool features after the encoder. They are never an input channel, so the pretrained backbone transfers with no mask dependency.</text>
</svg>
